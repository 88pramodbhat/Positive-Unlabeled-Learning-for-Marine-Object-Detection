[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pu_marine_detection"
version = "1.0.0"
description = "Positive-Unlabeled Learning Framework for Marine Object Detection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=0"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
